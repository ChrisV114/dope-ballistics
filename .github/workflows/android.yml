name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOPE_REVIEW_KEYSTORE: dope-review.jks
      DOPE_REVIEW_KEYSTORE_B64: ${{ secrets.DOPE_REVIEW_KEYSTORE_B64 }}
      DOPE_REVIEW_STORE_PASSWORD: ${{ secrets.DOPE_REVIEW_STORE_PASSWORD }}
      DOPE_REVIEW_KEY_ALIAS: ${{ secrets.DOPE_REVIEW_KEY_ALIAS }}
      DOPE_REVIEW_KEY_PASSWORD: ${{ secrets.DOPE_REVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Restore stable review signing key
        if: env.DOPE_REVIEW_KEYSTORE_B64 != ''
        run: printf '%s' "$DOPE_REVIEW_KEYSTORE_B64" | base64 --decode > "$DOPE_REVIEW_KEYSTORE"
      - run: ./gradlew spotlessCheck
      - run: ./gradlew lint
      - run: ./gradlew detekt
      - run: ./gradlew test
      - run: ./gradlew :app:validateDebugScreenshotTest
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-and-debug-apk
          path: |
            **/build/reports/**
            **/build/outputs/apk/debug/*.apk

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOPE_REVIEW_KEYSTORE: dope-review.jks
      DOPE_REVIEW_KEYSTORE_B64: ${{ secrets.DOPE_REVIEW_KEYSTORE_B64 }}
      DOPE_REVIEW_STORE_PASSWORD: ${{ secrets.DOPE_REVIEW_STORE_PASSWORD }}
      DOPE_REVIEW_KEY_ALIAS: ${{ secrets.DOPE_REVIEW_KEY_ALIAS }}
      DOPE_REVIEW_KEY_PASSWORD: ${{ secrets.DOPE_REVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Restore stable review signing key
        if: env.DOPE_REVIEW_KEYSTORE_B64 != ''
        run: printf '%s' "$DOPE_REVIEW_KEYSTORE_B64" | base64 --decode > "$DOPE_REVIEW_KEYSTORE"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumentation-reports
          path: "**/build/reports/androidTests/**"
